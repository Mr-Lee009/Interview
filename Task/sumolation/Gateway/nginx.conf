events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # [ƯU ĐIỂM GATEWAY]: Cấu hình giới hạn tần suất gọi (Rate Limiting) để chống Spam API
    # Chỉ cho phép 1 IP gọi tối đa 10 request trong 1 giây
    limit_req_zone $binary_remote_addr zone=api_limit_zone:10m rate=10r/s;

    server {
        listen 80;
        server_name localhost;

        # -------------------------------------------------------------
        # 1. ĐỊNH TUYẾN API SANG SPRING BOOT (Cổng 8080 ở máy Host)
        # -------------------------------------------------------------
        location /api/ {
            # Áp dụng bộ lọc chống Spam, cho phép tích lũy tối đa 5 request chờ (burst)
            limit_req zone=api_limit_zone burst=5 nodelay;

            # Vì Spring Boot chạy từ IntelliJ (máy thật), Nginx nằm trong Docker 
            # muốn gọi ra máy thật phải dùng địa chỉ đặc biệt: host.docker.internal
            proxy_pass http://host.docker.internal:8080/;
            
            # Giữ nguyên các thông tin gốc của Client truyền lên
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------
        # 2. ĐỊNH TUYẾN GIAO DIỆN QUẢN LÝ KAFKA UI (Cổng 8080 trong Docker)
        # -------------------------------------------------------------
        location / {
            proxy_pass http://kafka-ui:8080/;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cấu hình bắt buộc cho WebSocket (Giúp giao diện Kafka UI cập nhật tin nhắn real-time)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }
    }
}